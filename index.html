<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Titans 2 - Raid Analyzer</title>
    <!-- Link to your external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>📸 Tap Titans 2 Raid Scanner</h2>
    <p id="status">⏳ Initializing Web Engines (OpenCV & Tesseract)... Please wait.</p>

    <div class="upload-section">
        <div class="upload-box">
            <strong>1. Upload Raid Screenshot (raid.jpg)</strong>
            <p class="box-desc">Shows the live Titan health bars and strategies</p>
            <input type="file" id="sceneInput" accept="image/*" disabled>
            <img id="scenePreview" class="preview-img" alt="Raid snapshot preview">
        </div>
        
        <div class="upload-box">
            <strong>2. Upload Info Screenshot (info.jpg)</strong>
            <p class="box-desc">Shows the Titan reference data database rows</p>
            <input type="file" id="templateInput" accept="image/*" disabled>
            <img id="templatePreview" class="preview-img" alt="Info panel preview">
        </div>
    </div>

    <!-- Processing Button -->
    <button id="matchBtn" disabled>Run Deep Image Analysis</button>

    <!-- This container is where app.js dynamically injects the reporting table dashboard -->
    <div class="canvas-container"></div>
</div>

<!-- Load Tesseract.js for browser-based Optical Character Recognition -->
<script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    
<!-- Load the Techstark CORS-compliant variant of OpenCV.js for canvas manipulation tasks -->
<script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@5.0.0-release.1/dist/opencv.min.js" type="text/javascript"></script>

<!-- Polling Engine to detect when the async WebAssembly finishes unpacking -->
<script type="text/javascript">
    const checkOpenCV = setInterval(async () => {
        // Confirm the global variable namespace exists on the window object
        if (window.cv) {
            try {
                // If cv is wrapped as a Promise inside the bundle, resolve it cleanly
                if (window.cv instanceof Promise) {
                    window.cv = await window.cv;
                }
                
                // Confirm the foundational C++ constructors (like Mat) are compiled and alive
                if (window.cv && window.cv.Mat) {
                    clearInterval(checkOpenCV);
                    console.log("OpenCV.js Engine is fully compiled!");
                    
                    // Fire the callback method inside your app.js orchestrator
                    if (typeof window.onOpenCvReady === 'function') {
                        window.onOpenCvReady();
                    }
                }
            } catch (e) {
                console.log("Waiting for WebAssembly compilation...", e);
            }
        }
    }, 200); // Polls every 200ms
</script>

<!-- Load your application code explicitly as an ES Module to support internal system imports -->
<script src="app.js" type="module" defer></script>

</body>
</html>
