<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Titans 2 - Raid Analyzer</title>
    <!-- Link to your external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>📸 Tap Titans 2 Raid Scanner</h2>
    <p id="status">⏳ Initializing Web Engines (OpenCV & Tesseract)... Please wait.</p>

    <div class="upload-section">
        <div class="upload-box">
            <strong>1. Upload Raid Screenshot (raid.jpg)</strong>
            <p class="box-desc">Shows the live Titan health bars and strategies</p>
            <input type="file" id="sceneInput" accept="image/*" disabled>
            <img id="scenePreview" class="preview-img" alt="Raid snapshot preview">
        </div>
        
        <div class="upload-box">
            <strong>2. Upload Info Screenshot (info.jpg)</strong>
            <p class="box-desc">Shows the Titan reference data database rows</p>
            <input type="file" id="templateInput" accept="image/*" disabled>
            <img id="templatePreview" class="preview-img" alt="Info panel preview">
        </div>
    </div>

    <!-- Processing Button -->
    <button id="matchBtn" disabled>Run Deep Image Analysis</button>

    <!-- This container is where app.js dynamically injects the reporting table dashboard -->
    <div class="canvas-container"></div>
</div>

<!-- Load Tesseract.js for browser-based Optical Character Recognition -->
<script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>

<!-- Securely handle internal WebAssembly Runtime for OpenCV.js -->
<script type="text/javascript">
    // Emscripten hook that catches the precise moment OpenCV assembly finishes layout compiling
    var Module = {
        onRuntimeInitialized: function() {
            // Safe to let the UI know inputs are unblocked
            if (typeof window.onOpenCvReady === 'function') {
                window.onOpenCvReady();
            }
        }
    };
</script>
    
<!-- Load OpenCV.js from official mirrors for canvas manipulation tasks -->
<script async src="https://docs.opencv.org/5.0/opencv.js" type="text/javascript"></script>

<!-- Load your application code explicitly as an ES Module to support internal system imports -->
<script src="app.js" type="module" defer></script>

</body>
</html>
